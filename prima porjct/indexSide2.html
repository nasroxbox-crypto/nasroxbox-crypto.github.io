<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prima Chocolat - Premium European Chocolate</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpg" href="favicon.jpg">
<style>  * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Quicksand', sans-serif;
      overflow-x: hidden;
      background: #f5f0f8;
    }  .featured-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: linear-gradient(135deg,#7b51c0 0%,#5a3698 100%);
      min-height: 520px;
      overflow: hidden;
    }
    .featured-content {
      padding: 5rem 4rem 5rem 6rem;
      display: flex; flex-direction: column; justify-content: center;
    }
    .feat-eyebrow {
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 2.5px; text-transform: uppercase;
      color: rgba(255,255,255,0.45); margin-bottom: 1rem;
    }
    .featured-content h2 {
      font-family: 'Poppins', sans-serif;
      font-size: 3.8rem; font-weight: 800;
      color: #fff; line-height: 1.05;
      margin-bottom: 1.3rem; letter-spacing: -1px;
    }
    .featured-content p {
      font-size: 1.1rem; color: rgba(255,255,255,0.82);
      line-height: 1.8; max-width: 400px; margin-bottom: 2rem;
    }
    .featured-img-panel {
      position: relative; overflow: hidden;
    }
    .featured-img-panel img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
</style>
 </head>
 <body><section class="featured-section">
  <div class="featured-content">
    <p class="feat-eyebrow">LUXURY Series</p>
    <h2>DOUBLE CARAMEL</h2>
    <p>Experience chocolate like never before with our largest, most indulgent bars — crafted for moments that deserve something extraordinary.</p>
  </div>
  <div class="featured-img-panel">
    <!-- ════════════════════════════════════
         صورة MMMAX — غيّر الرابط هنا
         ════════════════════════════════════ -->
    <img src="photo_5956178200360586680_y.jpg"
         alt="MMMAX Collection">
    <!-- ════════════════════════════════════ -->
  </div>
</section></body>
